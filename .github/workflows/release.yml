name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to publish the release
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Tag matches the plugin version
        # Claude Code only updates an installed plugin when this version changes,
        # and the shim downloads the release named after it.
        run: |
          version=$(jq -r .version plugins/quality-kit/.claude-plugin/plugin.json)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json version $version. Raise version in plugins/quality-kit/.claude-plugin/plugin.json and tag v<version>."
            exit 1
          fi
      - run: go test ./...
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: v2.20.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
