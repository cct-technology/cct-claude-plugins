name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Quality Kit checks this repository with the workflow it ships, built from
  # the pull request's own qk.
  quality:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/quality.yml
    with:
      build-from-source: true
      # The same oasdiff the go job tests with, as in
      # docs/how-to/run-quality-kit-in-github-actions.md.
      setup: |
        v=1.35.0
        release="https://github.com/oasdiff/oasdiff/releases/download/v$v"
        mkdir -p "$RUNNER_TEMP/oasdiff" && cd "$RUNNER_TEMP/oasdiff"
        curl -fsSL -O "$release/oasdiff_${v}_linux_amd64.tar.gz" -O "$release/checksums.txt"
        grep " oasdiff_${v}_linux_amd64.tar.gz$" checksums.txt | sha256sum -c -
        tar -xzf "oasdiff_${v}_linux_amd64.tar.gz" oasdiff
        echo "$PWD" >> "$GITHUB_PATH"
    permissions:
      contents: read
      pull-requests: write

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # QK030's tests run the real oasdiff. A version, not @latest: a new release
      # must not change what this job tests.
      - run: go install github.com/oasdiff/oasdiff@v1.35.0
      - run: go test ./...
        env:
          QK_REQUIRE_OASDIFF: "1" # those tests fail, not skip, when oasdiff is missing
      - name: Generated reference docs are current
        if: runner.os == 'Linux'
        run: |
          go run ./cmd/gen-docs
          if [ -n "$(git status --porcelain -- docs/reference/)" ]; then
            git status --porcelain -- docs/reference/
            echo "::error::docs/reference is out of date. Run: go run ./cmd/gen-docs"
            exit 1
          fi
