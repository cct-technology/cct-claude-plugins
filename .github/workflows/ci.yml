name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Generated reference docs are current
        if: runner.os == 'Linux'
        run: |
          go run ./cmd/gen-docs
          if [ -n "$(git status --porcelain -- docs/reference/)" ]; then
            git status --porcelain -- docs/reference/
            echo "::error::docs/reference is out of date. Run: go run ./cmd/gen-docs"
            exit 1
          fi
