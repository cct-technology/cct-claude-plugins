name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # qk compares against the merge-base with main
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go run ./cmd/qk check --base origin/main

  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Generated reference docs are current
        if: runner.os == 'Linux'
        run: |
          go run ./cmd/gen-docs
          if [ -n "$(git status --porcelain -- docs/reference/)" ]; then
            git status --porcelain -- docs/reference/
            echo "::error::docs/reference is out of date. Run: go run ./cmd/gen-docs"
            exit 1
          fi
